<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>网络韧性 Network Resilience</title>
<meta name="description" content="网络韧性：专注交通系统韧性与可靠性研究，融合复杂网络建模、大数据挖掘与深度学习。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23173A5E'/%3E%3Ccircle cx='11' cy='16' r='3.2' fill='%231F9E97'/%3E%3Ccircle cx='22' cy='10' r='3.2' fill='%23E8833A'/%3E%3Ccircle cx='22' cy='22' r='3.2' fill='%231F9E97'/%3E%3Cpath d='M11 16 L22 10 M11 16 L22 22 M22 10 L22 22' stroke='%23ffffff' stroke-width='1.4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap">
<style>
:root{
  --navy:#173A5E; --navy-deep:#0E2740; --teal:#1F9E97; --teal-dark:#157A75;
  --amber:#E8833A; --bg:#F3F6F8; --card:#FFFFFF; --ink:#26333F; --muted:#5F7180;
  --line:#E1E8EC; --maxw:1120px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",system-ui,-apple-system,sans-serif;
  color:var(--ink);background:var(--bg);line-height:1.7;font-size:16px;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:var(--teal-dark);text-decoration:none}
a:hover{color:var(--teal)}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}

/* ===== 视图路由显隐 ===== */
.view{display:none}
.view.active{display:block}

/* ===== 顶部导航 ===== */
.site-nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:66px;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{height:40px;width:auto}
.brand-name{display:flex;flex-direction:column;line-height:1.2}
.brand-name b{font-size:18px;color:var(--navy);font-weight:900;letter-spacing:.02em}
.brand-name span{font-size:11px;color:var(--muted);letter-spacing:.08em}
.nav-right{display:flex;align-items:center;gap:14px}
.nav-links{display:flex;gap:4px;align-items:center}
.nav-links a{color:var(--ink);font-size:15px;font-weight:500;padding:8px 13px;border-radius:8px}
.nav-links a:hover{background:var(--bg);color:var(--teal-dark)}
.nav-links a.active{color:var(--teal-dark);background:#E7F3F2}
.lang-switch{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang-switch button{border:none;background:#fff;padding:7px 13px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--muted);font-family:inherit}
.lang-switch button.on{background:var(--teal);color:#fff}
.nav-toggle{display:none;background:none;border:1px solid var(--line);border-radius:8px;width:42px;height:42px;cursor:pointer;align-items:center;justify-content:center}
.nav-toggle span{display:block;width:20px;height:2px;background:var(--navy);margin:3px 0;border-radius:2px}

/* ===== Hero ===== */
.hero{position:relative;color:#fff;overflow:hidden;min-height:74vh;display:flex;align-items:center}
.hero-bg{position:absolute;inset:0}
.hero-bg img{width:100%;height:100%;object-fit:cover;object-position:center 40%}
.hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(14,39,64,.92) 0%,rgba(14,39,64,.78) 45%,rgba(14,39,64,.45) 100%)}
.hero-net{position:absolute;inset:0;opacity:.18;pointer-events:none}
.hero-inner{position:relative;z-index:2;padding-block:92px}
.hero-kicker{display:inline-flex;align-items:center;gap:10px;font-size:14px;letter-spacing:.12em;color:#BFE3E0;font-weight:500;margin-bottom:22px}
.hero-kicker::before{content:"";width:34px;height:2px;background:var(--teal)}
.hero h1{font-size:clamp(36px,7vw,64px);font-weight:900;line-height:1.15;letter-spacing:.02em}
.hero .en-sub{font-size:clamp(17px,3vw,25px);font-weight:300;letter-spacing:.18em;color:#D7E6EE;margin-top:10px}
.hero p.lede{max-width:620px;margin-top:22px;font-size:17px;color:#E6EEF3;font-weight:300}
.chips{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.chip{border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:9px 18px;font-size:14px;color:#fff;background:rgba(255,255,255,.08)}
.chip em{font-style:normal;color:var(--amber);margin-right:8px;font-weight:700}

/* ===== 通用区块 ===== */
section{padding:72px 0}
.sec-head{margin-bottom:34px}
.sec-head .kicker{font-size:13px;letter-spacing:.16em;color:var(--teal-dark);font-weight:700}
.sec-head h2{font-size:clamp(26px,4vw,34px);font-weight:900;color:var(--navy);margin-top:8px}
.sec-head .en-sub{color:var(--muted);font-size:15px;font-weight:300;letter-spacing:.06em;margin-top:4px}

/* ===== 简介 ===== */
.about-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:32px;max-width:880px;margin:0 auto}
.about-card p{font-size:16px;text-align:justify;color:var(--ink)}

/* ===== 近期发布 / 论文列表 ===== */
.pub-list{display:flex;flex-direction:column}
.pub-item{display:grid;grid-template-columns:96px 1fr;gap:24px;padding:26px 0;border-bottom:1px solid var(--line)}
.pub-item:first-child{padding-top:0}
.pub-year{align-self:start;background:var(--navy);color:#fff;border-radius:10px;padding:10px 0;text-align:center;font-weight:900;font-size:20px}
.pub-body h3{font-size:18px;font-weight:700;line-height:1.5}
.pub-body h3 a{color:var(--navy)}
.pub-body h3 a:hover{color:var(--teal-dark)}
.pub-meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:13.5px;color:var(--muted)}
.pub-meta .dot{color:var(--teal)}
.pub-meta a{color:var(--teal-dark);word-break:break-all}

/* ===== 研究成果列表（独立视图） ===== */
.out-list{display:flex;flex-direction:column;max-width:960px;margin:0 auto}
.out-item{display:grid;grid-template-columns:88px 1fr;gap:22px;padding:24px 0;border-bottom:1px solid var(--line)}
.out-item:first-child{padding-top:0}
.out-date{align-self:start;background:#E7F3F2;color:var(--teal-dark);border-radius:10px;padding:9px 0;text-align:center;font-weight:700;font-size:14px;letter-spacing:.03em}
.out-body h3{font-size:17px;font-weight:700;line-height:1.55}
.out-body h3 a{color:var(--navy)}
.out-body h3 a:hover{color:var(--teal-dark)}
.out-en{font-size:14px;font-style:italic;color:#3D4C59;margin-top:6px;line-height:1.5}
.out-meta{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px;color:var(--muted)}
.out-meta .dot{color:var(--teal)}
.out-meta a{color:var(--teal-dark);word-break:break-all}

/* ===== 研究方向（独立视图） ===== */
.research{background:var(--card)}
.dir-lead{max-width:720px;color:var(--muted);font-size:16px;margin-bottom:34px}
.dir-lead b{color:var(--teal-dark)}
.dir-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.dir-card{border:1px solid var(--line);border-radius:14px;padding:28px 24px;background:var(--bg);transition:transform .2s,box-shadow .2s}
.dir-card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(23,58,94,.10)}
.dir-card svg{width:56px;height:56px;margin-bottom:18px}
.dir-card h3{font-size:18px;font-weight:700;color:var(--navy)}
.dir-card .en{font-size:13px;color:var(--teal-dark);margin:4px 0 12px}
.dir-card p{font-size:14.5px;color:var(--muted)}

/* ===== 团队（独立视图） ===== */
.team-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px;max-width:760px}
.member{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:center}
.member .photo{height:280px;background:#E8EEF1;display:flex;align-items:center;justify-content:center}
.member .photo img{max-width:100%;max-height:100%;object-fit:contain;object-position:center;padding:16px}
.member .photo.ph{color:var(--navy);font-size:46px;font-weight:900}
.member .info{padding:20px}
.member .name{font-size:19px;font-weight:700;color:var(--navy)}
.member .name-en{font-size:14px;color:var(--muted);margin-top:2px}
.member .role{display:inline-block;margin-top:12px;font-size:13px;color:var(--teal-dark);background:#E7F3F2;border-radius:999px;padding:5px 14px}

/* ===== 联系 ===== */
.contact{background:var(--navy-deep);color:#E6EEF3}
.contact .sec-head h2{color:#fff}
.contact .sec-head .kicker{color:#7FC9C3}
.contact-grid{display:grid;grid-template-columns:1fr;gap:22px;max-width:560px}
.contact-card{border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:28px}
.contact-card h3{font-size:16px;color:#BFE3E0;margin-bottom:10px;font-weight:700}
.contact-card a.mail{font-size:20px;font-weight:700;color:#fff;letter-spacing:.02em}
.contact-card a.mail:hover{color:var(--teal)}
.contact-card p{font-size:15px;color:#D7E6EE}

footer{background:#0A1E30;color:#9DB3C2;padding:28px 0;font-size:13.5px;text-align:center}
footer .f-brand{color:#fff;font-weight:700;margin-bottom:6px}

/* ===== 响应式 ===== */
@media (max-width:900px){
  .dir-cards{grid-template-columns:1fr;gap:16px}
  .contact-grid{grid-template-columns:1fr}
}
@media (max-width:768px){
  .nav-links{position:absolute;top:66px;left:0;right:0;background:#fff;flex-direction:column;align-items:stretch;padding:12px 20px 18px;border-bottom:1px solid var(--line);display:none;gap:2px}
  .nav-links.open{display:flex}
  .nav-links a{padding:13px 14px;font-size:16px}
  .nav-toggle{display:flex;flex-direction:column}
  section{padding:52px 0}
  .hero{min-height:62vh}
  .hero-inner{padding-block:64px}
  .pub-item{grid-template-columns:1fr;gap:12px}
  .pub-year{justify-self:start;padding:8px 18px;font-size:16px}
  .out-item{grid-template-columns:1fr;gap:10px}
  .out-date{justify-self:start;padding:7px 16px;font-size:13px}
}
</style>
</head>

ation. Whether discussing academic ideas or project progress, everyone feels comfortable expressing thoughts freely and working together to overcome challenges in a relaxed atmosphere. In talent development, we emphasize not only honing students' core competencies in data analysis and network modeling through cutting-edge research projects, but also providing abundant opportunities for overseas exchange and doctoral studies through extensive international collaborations. We sincerely invite those who are willing to work diligently and aspire to genuine growth to join us—share knowledge, exchange ideas, explore the unknown, and create value together in the field of transportation system resilience."

function renderChips(){
  $("#heroChips").innerHTML = CONFIG.chips[lang].map((c,i)=>`<span class="chip"><em>0${i+1}</em>${c}</span>`).join("");
}
function renderAbout(){ $("#aboutBody").textContent = CONFIG.about[lang]; }
function renderResearch(){
  $("#researchLead").innerHTML = CONFIG.researchLead[lang];
  $("#researchList").innerHTML = CONFIG.research.map(r=>`
    <div class="dir-card">${ICONS[r.icon]||ICONS.net}
      <h3>${r[lang].title}</h3>
      ${r[lang].sub?`<div class="en">${r[lang].sub}</div>`:""}
      <p>${r[lang].desc}</p>
    </div>`).join("");
}
function renderTeam(){
  $("#teamList").innerHTML = CONFIG.members.map(m=>{
    const photo = m.photo
      ? `<div class="photo"><img src="${m.photo.startsWith('data:')?m.photo:'assets/'+m.photo}" alt="${m[lang].name}"></div>`
      : `<div class="photo ph">${m.sur}</div>`;
    return `<div class="member">${photo}
      <div class="info">
        <div class="name">${m[lang].name}</div>
        ${m[lang].en?`<div class="name-en">${m[lang].en}</div>`:""}
        <div class="role">${m[lang].role}</div>
      </div></div>`;
  }).join("");
}
function renderPubs(){
  $("#pubList").innerHTML = CONFIG.publications.map(p=>`
    <article class="pub-item">
      <div class="pub-year">${p.year}</div>
      <div class="pub-body">
        <h3><a href="${p.doi}" target="_blank" rel="noopener">${p[lang].title}</a></h3>
        <div class="pub-meta"><span>${p[lang].meta}</span><span class="dot">·</span>
          <span><a href="${p.doi}" target="_blank" rel="noopener">${p.doi.replace("https://doi.org/","")}</a></span>
        </div>
      </div>
    </article>`).join("");
}
function renderOutputs(){
  $("#outList").innerHTML = CONFIG.outputs.map(o=>`
    <article class="out-item">
      <div class="out-date">${o.date}</div>
      <div class="out-body">
        <h3><a href="${o.mp}" target="_blank" rel="noopener">${o[lang].title}</a></h3>
        ${lang==="zh" && o.zh.enName?`<div class="out-en">${o.zh.enName}</div>`:""}
        <div class="out-meta"><span>${o[lang].venue}</span>
          ${o.src?`<span class="dot">·</span><span><a href="${o.src}" target="_blank" rel="noopener">${lang==="zh"?"原文 Original":"Original"}</a></span>`:""}
          <span class="dot">·</span><span><a href="${o.mp}" target="_blank" rel="noopener">${lang==="zh"?"公众号推文 WeChat Post":"WeChat Post"}</a></span>
        </div>
      </div>
    </article>`).join("");
}
function renderContact(){
  const mail = $("#mailLink");
  mail.textContent = CONFIG.contact.mail;
  mail.href = "mailto:" + CONFIG.contact.mail;
}
function applyLang(){
  const u = CONFIG.ui[lang];
  document.documentElement.lang = lang==="zh" ? "zh-CN" : "en";
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent = u[el.dataset.i18n] || ""; });
  $("#btnZh").classList.toggle("on", lang==="zh");
  $("#btnEn").classList.toggle("on", lang==="en");
  renderChips(); renderAbout(); renderResearch(); renderTeam(); renderPubs(); renderOutputs(); renderContact();
}

/* ---- 路由：#/home #/research #/publications #/team ---- */
function route(){
  const h = (location.hash.replace("#/","")) || "home";
  ["home","research","publications","team"].forEach(v=>{
    $("#view-"+v).classList.toggle("active", v===h);
  });
  document.querySelectorAll(".nav-links a").forEach(a=>{
    a.classList.toggle("active", a.dataset.route===h);
  });
  window.scrollTo({top:0,behavior:"auto"});
}

/* ---- 事件 ---- */
$("#btnZh").addEventListener("click",()=>setLang("zh"));
$("#btnEn").addEventListener("click",()=>setLang("en"));
function setLang(l){ lang=l; localStorage.setItem("nr-lang",l); applyLang(); }
window.addEventListener("hashchange", route);

const navLinks = $("#navLinks"), navToggle = $("#navToggle");
navToggle.addEventListener("click",()=>navLinks.classList.toggle("open"));
navLinks.querySelectorAll("a").forEach(a=>a.addEventListener("click",()=>navLinks.classList.remove("open")));

applyLang();
route();
</script>
</body>
</html>
